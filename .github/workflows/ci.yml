name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Unit tests
        run: scripts/ci-run.sh swift test

      - name: Build app
        run: scripts/ci-run.sh scripts/build-app.sh "0.0.0-ci.${{ github.run_number }}"

      - name: Smoke test (CLI, snapshots, Services menu)
        run: scripts/ci-run.sh scripts/smoke-test.sh --install

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: HighlightCode-ci-${{ github.run_number }}
          path: |
            build/*.zip
            build/smoke/
          if-no-files-found: ignore

  linux-core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: scripts/ci-run.sh swift test
