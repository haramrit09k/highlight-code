name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "labeled" so that adding the "snapshots" label publishes screenshots straight away.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      screenshots_dir:
        description: "Commit the app snapshots to the pr-assets branch under this folder (e.g. pr-1). Leave empty to skip."
        required: false
        default: ""

# A new push to a branch cancels that branch's runs still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      # Signed with the project's stable self-signed identity when the secrets are
      # available (not on forks), so test builds keep their Accessibility permission.
      # No update key here: test builds must not offer to "update" to an older release.
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Import signing certificate
        if: env.MACOS_SIGNING_P12 != ''
        run: scripts/ci-run.sh scripts/import-signing-cert.sh

      - name: Unit tests
        run: scripts/ci-run.sh swift test

      - name: Build app
        run: scripts/ci-run.sh scripts/build-app.sh "0.0.0-ci.${{ github.run_number }}"

      - name: Smoke test (CLI, snapshots, Services menu)
        run: scripts/ci-run.sh scripts/smoke-test.sh --install

      - name: Publish snapshots to pr-assets
        # Manually with a folder name, or on pull requests labelled "snapshots" (from this repo).
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.screenshots_dir != '') ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'snapshots') &&
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          DIR: ${{ inputs.screenshots_dir || format('pr-{0}', github.event.pull_request.number) }}
        run: scripts/ci-run.sh scripts/publish-snapshots.sh "$DIR"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: HighlightCode-ci-${{ github.run_number }}
          path: |
            build/*.zip
            build/smoke/
          if-no-files-found: ignore

  # The same checks on the other macOS versions and chips GitHub offers (macOS 13, the
  # oldest version the app supports, no longer has hosted runners).
  compatibility:
    name: Compatibility (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v5

      - name: System
        run: sw_vers && uname -m && swift --version

      - name: Unit tests
        run: scripts/ci-run.sh swift test

      - name: Build app
        run: scripts/ci-run.sh scripts/build-app.sh "0.0.0-ci.${{ github.run_number }}"

      - name: Smoke test (CLI, Services menu)
        run: scripts/ci-run.sh scripts/smoke-test.sh --install --no-snapshots

  linux-core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: scripts/ci-run.sh swift test
