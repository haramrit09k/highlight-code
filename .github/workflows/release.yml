name: Release

# Push a tag like v1.0.0 to build the app and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Never run two releases at once, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        run: scripts/ci-run.sh swift test

      - name: Build app
        run: scripts/ci-run.sh scripts/build-app.sh "${GITHUB_REF_NAME#v}"

      - name: Smoke test
        run: scripts/ci-run.sh scripts/smoke-test.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/HighlightCode-*.zip \
            --title "Highlight Code ${GITHUB_REF_NAME}" \
            --generate-notes
